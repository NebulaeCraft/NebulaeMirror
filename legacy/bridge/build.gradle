buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'

// Keep in sync with MirrorBridge.VERSION
version = '0.3.0'
group = 'net.kuina.nebulaemirror'
archivesBaseName = 'MirrorBridge-1.12.2'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

def isMacosArm = org.gradle.internal.os.OperatingSystem.current().isMacOsX() &&
        ['aarch64', 'arm64'].contains(System.getProperty('os.arch').toLowerCase())
if (isMacosArm) {
    configurations.all {
        resolutionStrategy.force 'org.lwjgl.lwjgl:lwjgl:2.9.4-nightly-20150209'
        resolutionStrategy.force 'org.lwjgl.lwjgl:lwjgl_util:2.9.4-nightly-20150209'
        resolutionStrategy.force 'net.java.dev.jna:jna:5.13.0'
    }
}

minecraft {
    // Same Forge + mappings as the dumper and NebulaeCraft (shared ForgeGradle cache).
    mappings channel: 'snapshot', version: '20171003-1.12'
    runs {
        // Dev server for testing patches: ./gradlew runServer (world in run/world)
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
        }
    }
}

repositories {
    // WorldEdit 6 API for the lock mask (provided at runtime by WorldEdit-Forge 6.1.10 / FAWE on the origin).
    maven { url = 'https://maven.enginehub.org/repo/' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2864'
    compileOnly('com.sk89q.worldedit:worldedit-core:6.1.4-SNAPSHOT') { transitive = false }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('mcmod.info') {
        expand 'version': project.version
    }
}

jar {
    manifest {
        attributes([
            "Implementation-Title"  : project.name,
            "Implementation-Version": "${version}",
        ])
    }
}

// SRG-named jar for the production 1.12.2 Forge (+ SpongeForge) server.
jar.finalizedBy('reobfJar')

// Let the dev server read console commands (e.g. "mirrorbridge apply ...", "stop") from stdin.
tasks.matching { it.name == 'runServer' }.configureEach {
    standardInput = System.in
}
