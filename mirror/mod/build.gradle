plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

// Output of mirror/generator (python3 -I mirror/generator/generate.py ...). Override with -PgenDir=...
def genDir = file(project.findProperty('genDir') ?: "${rootDir}/../../work/gen")

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property 'version', project.version
    inputs.dir genDir
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
    // Generated block definitions, mappings and assets are bundled into the jar.
    from(new File(genDir, 'mirror')) { into 'nebulaemirror/mirror' }
    from(new File(genDir, 'assets')) { into 'assets' }
    from(new File(genDir, 'data')) { into 'data' }
    doFirst {
        if (!new File(genDir, 'mirror/blocks.json').isFile()) {
            throw new GradleException("No generator output in ${genDir}; run mirror/generator/generate.py first")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

loom {
    runs {
        // Screenshot tour of a singleplayer world: ./gradlew runTourClient -PtourWorld=world -PtourFile=/abs/tour.txt
        // (copy the world into run/tour/saves/ first).
        tourClient {
            client()
            name 'Tour Client'
            runDir 'run/tour'
            programArgs '--quickPlaySingleplayer', (project.findProperty('tourWorld') ?: 'world')
            vmArg "-Dnebulaemirror.tour=${project.findProperty('tourFile') ?: ''}"
        }
        // Full import at server start: ./gradlew runImportServer -PimportSource=/path/to/1.12/world [-PimportRegions=x1,z1,x2,z2]
        // Uses run/import as the server directory (void flat world, see docs/importer.md).
        importServer {
            server()
            name 'Import Server'
            runDir 'run/import'
            if (project.hasProperty('importSource')) {
                vmArg "-Dnebulaemirror.import=${project.property('importSource')}"
            }
            if (project.hasProperty('importRegions')) {
                vmArg "-Dnebulaemirror.import.regions=${project.property('importRegions')}"
            }
            if (project.hasProperty('importOverwrite')) {
                vmArg '-Dnebulaemirror.import.overwrite=true'
            }
        }
        // Headless check: registers everything, bakes every mesh, writes a report, exits.
        selftestClient {
            client()
            name 'Self-test Client'
            vmArg '-Dnebulaemirror.selftest=true'
            runDir 'run/selftest'
        }
    }
}

// Let the dev servers read console commands (e.g. "nebulaemirror stats ...", "stop") from stdin.
tasks.matching { it.name in ['runServer', 'runImportServer'] }.configureEach {
    standardInput = System.in
}
